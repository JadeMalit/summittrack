name: Build Unsigned iOS App

on:
  push:
    branches: [ main, master, Migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Clean Previous Builds & Artifacts
        working-directory: SummitTrack-Front-End
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock

      - name: Install Dependencies
        working-directory: SummitTrack-Front-End
        run: flutter pub get

      - name: Setup CocoaPods & Pod Install
        working-directory: SummitTrack-Front-End/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Build Unsigned iOS App
        working-directory: SummitTrack-Front-End
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        working-directory: SummitTrack-Front-End
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 MyApp.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: SummitTrack-Front-End/MyApp.ipa