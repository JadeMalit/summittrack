name: Build Unsigned iOS App

on:
  push:
    branches: [ main, master, Migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: SummitTrack-Front-End
        run: flutter pub get

      - name: Setup CocoaPods & Pod Install
        working-directory: SummitTrack-Front-End/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Build Unsigned iOS App
        working-directory: SummitTrack-Front-End
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build/ios_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      - name: Package Payload to .ipa
        working-directory: SummitTrack-Front-End
        run: |
          mkdir -p build/ios_output/Payload
          cp -r build/ios_output/Build/Products/Release-iphoneos/Runner.app build/ios_output/Payload/
          cd build/ios_output
          zip -r -9 MyApp.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: SummitTrack-Front-End/build/ios_output/MyApp.ipa