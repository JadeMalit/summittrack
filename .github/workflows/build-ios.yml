name: Build Unsigned iOS App

on:
  push:
    branches: [ main, master, Migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16.2 (Swift 6 Support)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean Previous Builds & Caches
        working-directory: SummitTrack-Front-End
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks ios/Flutter/ephemeral build/

      - name: Install Dependencies
        working-directory: SummitTrack-Front-End
        run: flutter pub get

      - name: Patch Firebase Storage Non-Modular Header
        run: |
          find ~/.pub-cache -name "FLTTaskStateChannelStreamHandler.h" -exec sed -i '' 's|<Firebase/Firebase.h>|<FirebaseStorage/FirebaseStorage.h>|g' {} + || true

      - name: Setup CocoaPods & Pod Install
        working-directory: SummitTrack-Front-End/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Build Unsigned iOS App
        working-directory: SummitTrack-Front-End
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        working-directory: SummitTrack-Front-End
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 MyApp.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: SummitTrack-Front-End/MyApp.ipa