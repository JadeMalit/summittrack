<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummitTrack - Live GPS Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ecefe6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
    h2 {
      margin: 0;
      color: #1b381e;
      font-size: 1.4rem;
    }
    .status-badge {
      font-weight: bold;
      color: #d97706;
      background: #fef3c7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #f4f6f0;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-weight: bold;
      color: #2d4f28;
      display: block;
    }
    #map {
      height: 500px;
      width: 100%;
      border-radius: 14px;
      border: 2px solid #d4dec9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h2>🏔️ SummitTrack Live Tracker</h2>
        <div class="status-badge" id="statusLabel">⏳ WAITING FOR GPS SIGNAL...</div>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-value" id="hikeId">Loading...</span>
          <span>Hike ID</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="coords">-- , --</span>
          <span>Location (Lat, Lng)</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="alt">-- m</span>
          <span>Altitude</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="speed">-- km/h</span>
          <span>Speed</span>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet & Firebase SDKs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>

  <script>
    // Initial Map View
    const map = L.map('map').setView([12.8797, 121.7740], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors | SummitTrack'
    }).addTo(map);

    let userMarker = null;

    const urlParams = new URLSearchParams(window.location.search);
    const hikeId = urlParams.get('hikeId');
    document.getElementById('hikeId').innerText = hikeId ? hikeId.substring(0, 10) + '...' : 'N/A';

    if (hikeId && typeof firebase !== 'undefined') {
      const db = firebase.firestore();

      db.collection('live_tracking').doc(hikeId).onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const lat = data.latitude || data.lat;
          const lng = data.longitude || data.lng;
          const alt = data.altitude ? Math.round(data.altitude) + ' m' : '-- m';
          const speed = data.speed ? (data.speed * 3.6).toFixed(1) + ' km/h' : '0.0 km/h';

          document.getElementById('alt').innerText = alt;
          document.getElementById('speed').innerText = speed;

          if (lat && lng) {
            document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            
            const label = document.getElementById('statusLabel');
            label.innerText = '🟢 LIVE BROADCASTING';
            label.style.background = '#e8f5e9';
            label.style.color = '#2e7d32';

            const newPos = [lat, lng];

            if (!userMarker) {
              // High-visibility Red Pin Marker
              const redIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
              });

              userMarker = L.marker(newPos, { icon: redIcon }).addTo(map)
                .bindPopup('<b>📍 Hiker Current Location</b>')
                .openPopup();

              // 🎯 AUTOMATICALLY FOCUS AND ZOOM TO USER LOCATION!
              map.setView(newPos, 16);
            } else {
              userMarker.setLatLng(newPos);
              map.panTo(newPos);
            }
          }
        }
      });
    }
  </script>
</body>
</html>
