<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummitTrack Live Hike</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon-box {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 {
      color: #1B4D2E;
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: bold;
    }
    p {
      color: #666;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: #1B4D2E;
      color: white !important;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      box-shadow: 0 4px 12px rgba(27,77,46,0.3);
      cursor: pointer;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🏔️</div>
    <h2>SummitTrack Live Hike</h2>
    <p>I-tap ang button sa ibaba para buksan ang live location sa SummitTrack App.</p>

    <a id="appBtn" href="summittrack://track" class="btn">🚀 BUKSAN SA SUMMITTRACK APP</a>

    <p class="note">Binubuksan ang live tracking sa app...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hikeId = urlParams.get('hikeId');

    if (hikeId) {
      const schemeUrl = "summittrack://track?hikeId=" + encodeURIComponent(hikeId);
      const btn = document.getElementById('appBtn');

      btn.href = schemeUrl;

      function openApp() {
        // Direct custom scheme invocation
        window.location.href = schemeUrl;
      }

      btn.addEventListener('click', function(e) {
        openApp();
      });

      window.onload = function() {
        setTimeout(openApp, 200);
      };
    }
  </script>
</body>
</html>
