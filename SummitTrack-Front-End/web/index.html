<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummitTrack Live Hike</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon-box {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 {
      color: #1B4D2E;
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: bold;
    }
    p {
      color: #666;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: #1B4D2E;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      box-shadow: 0 4px 12px rgba(27,77,46,0.3);
      cursor: pointer;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🏔️</div>
    <h2>SummitTrack Live Hike</h2>
    <p>I-tap ang button sa ibaba para buksan ang live location sa SummitTrack App.</p>

    <a id="appBtn" href="#" class="btn">🚀 BUKSAN SA SUMMITTRACK APP</a>

    <p class="note">Kapag ayaw magbukas, i-tap ang <b>3 dots (⋮)</b> sa taas at piliin ang <b>"Open in Browser" / "Open in Safari"</b>.</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hikeId = urlParams.get('hikeId');

    if (hikeId) {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

      // iOS scheme vs Android intent
      const deepLinkUrl = isIOS
        ? "summittrack://track?hikeId=" + encodeURIComponent(hikeId)
        : "intent://track?hikeId=" + encodeURIComponent(hikeId) + "#Intent;scheme=summittrack;package=com.example.summittrack;end;";

      const btn = document.getElementById('appBtn');
      btn.href = deepLinkUrl;

      btn.onclick = function(e) {
        e.preventDefault();
        window.location.href = deepLinkUrl;
      };
    }
  </script>
</body>
</html>
