<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummitTrack Live Hike</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon-box {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 {
      color: #1B4D2E;
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: bold;
    }
    p {
      color: #666;
      font-size: 14px;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: #1B4D2E;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      box-shadow: 0 4px 12px rgba(27,77,46,0.3);
      cursor: pointer;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🏔️</div>
    <h2>SummitTrack Live Hike</h2>
    <p>I-tap ang button sa ibaba para buksan ang live location sa SummitTrack App.</p>

    <button id="appBtn" class="btn">🚀 BUKSAN SA SUMMITTRACK APP</button>

    <p class="note">Binubuksan ang live tracking sa app...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hikeId = urlParams.get('hikeId');

    if (hikeId) {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
      const isAndroid = /android/i.test(userAgent);

      function launchApp() {
        if (isIOS) {
          const iosCustomUrl = "summittrack://track?hikeId=" + encodeURIComponent(hikeId);
          
          // Method 1: IFrame dispatch para sa Messenger In-App WebView
          const iframe = document.createElement("iframe");
          iframe.style.border = "none";
          iframe.style.width = "1px";
          iframe.style.height = "1px";
          iframe.src = iosCustomUrl;
          document.body.appendChild(iframe);

          // Method 2: Direct top-level assign
          setTimeout(() => {
            window.location.assign(iosCustomUrl);
          }, 50);
        } else if (isAndroid) {
          const androidIntent = "intent://track?hikeId=" + encodeURIComponent(hikeId) + "#Intent;scheme=summittrack;package=com.summittrack.app;end;";
          window.location.href = androidIntent;
        }
      }

      // Auto-trigger kapag kakabukas lang mula sa Messenger
      window.onload = function() {
        setTimeout(launchApp, 300);
      };

      // Trigger kapag pinindot ang button
      document.getElementById('appBtn').onclick = function(e) {
        e.preventDefault();
        launchApp();
      };
    }
  </script>
</body>
</html>
